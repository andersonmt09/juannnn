version: "3.9"
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: axon_db
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      PORT: 4000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: axon_db
      JWT_SECRET: docker_secret_change_me_please_1234567890
      JWT_REFRESH_SECRET: docker_refresh_secret_change_me_please_0987654321
      NODE_ENV: production
      FRONTEND_ORIGIN: http://localhost:8080
    ports:
      - "4000:4000"
    depends_on:
      mysql:
        condition: service_healthy
    command: sh -c "node src/dbInit.js && node src/seed.js && node src/server.js"

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mysql_data: